name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rems_ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: rems_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rems_ci -d rems_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # These credentials and role alterations exist only in this disposable CI service.
      DATABASE_ADMIN_URL: postgresql://rems_ci:ci_only@localhost:5432/rems_ci
      DATABASE_URL: postgresql://rems_application:rems_application_ci_only@localhost:5432/rems_ci
      APPLICATION_DATABASE_URL: postgresql://rems_application:rems_application_ci_only@localhost:5432/rems_ci
      AUDIT_READER_DATABASE_URL: postgresql://rems_audit_reader:rems_audit_reader_ci_only@localhost:5432/rems_ci
      MIGRATION_DATABASE_URL: postgresql://rems_migration_owner:rems_migration_owner_ci_only@localhost:5432/rems_ci
      IDENTITY_ADMIN_DATABASE_URL: postgresql://rems_identity_admin:rems_identity_admin_ci_only@localhost:5432/rems_ci
      FOUNDER_BOOTSTRAP_DATABASE_URL: postgresql://rems_founder_bootstrap:rems_founder_bootstrap_ci_only@localhost:5432/rems_ci
      SECURITY_READER_DATABASE_URL: postgresql://rems_security_reader:rems_security_reader_ci_only@localhost:5432/rems_ci
      BACKUP_DATABASE_URL: postgresql://rems_backup:rems_backup_ci_only@localhost:5432/rems_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error \
            --output /tmp/postgresql-pgdg.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo install -m 0644 /tmp/postgresql-pgdg.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
          test "$(/usr/lib/postgresql/17/bin/pg_dump --version | awk '{print $3}' | cut -d. -f1)" = 17
          test "$(/usr/lib/postgresql/17/bin/pg_restore --version | awk '{print $3}' | cut -d. -f1)" = 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rems/database prisma:generate
      - run: pnpm exec prettier --check .
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Bootstrap disposable database roles
        env:
          PGPASSWORD: ci_only
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -f packages/database/security/bootstrap-roles.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -f packages/database/security/bootstrap-identity-admin-role.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" <<'SQL'
          ALTER ROLE rems_migration_owner PASSWORD 'rems_migration_owner_ci_only';
          ALTER ROLE rems_application PASSWORD 'rems_application_ci_only';
          ALTER ROLE rems_audit_reader PASSWORD 'rems_audit_reader_ci_only';
          ALTER ROLE rems_emergency_admin PASSWORD 'rems_emergency_admin_ci_only';
          ALTER ROLE rems_identity_admin PASSWORD 'rems_identity_admin_ci_only';
          ALTER ROLE rems_founder_bootstrap PASSWORD 'rems_founder_bootstrap_ci_only';
          SQL
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
        run: pnpm --filter @rems/database prisma:migrate:deploy
      - name: Bootstrap security-evidence reader after its table exists
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -f packages/database/security/bootstrap-security-reader-role.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -f packages/database/security/bootstrap-backup-role.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -c "ALTER ROLE rems_security_reader PASSWORD 'rems_security_reader_ci_only'"
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -c "ALTER ROLE rems_backup PASSWORD 'rems_backup_ci_only'"
          test "$(psql -v ON_ERROR_STOP=1 "$BACKUP_DATABASE_URL" -Atc 'SELECT count(*) >= 0 FROM "ExecutiveIdentity"')" = t
          ! psql -v ON_ERROR_STOP=1 "$BACKUP_DATABASE_URL" -c 'CREATE TABLE forbidden_backup(id int)'
          ! psql -v ON_ERROR_STOP=1 "$BACKUP_DATABASE_URL" -c 'TRUNCATE TABLE "AuditEvent"'
          ! psql -v ON_ERROR_STOP=1 "$BACKUP_DATABASE_URL" -c 'UPDATE "ExecutiveIdentity" SET "displayName"='"'"'forbidden'"'"''
      - run: pnpm db:validate
      - run: pnpm test
      - name: Run PostgreSQL integration tests
        run: RUN_DATABASE_INTEGRATION=1 pnpm test
      - name: Verify restricted PostgreSQL roles
        run: pnpm test:db-security
      - name: Verify additive upgrade from the immutable foundation migration
        env:
          UPGRADE_ADMIN_URL: postgresql://rems_ci:ci_only@localhost:5432/rems_ci_upgrade
          UPGRADE_MIGRATION_URL: postgresql://rems_migration_owner:rems_migration_owner_ci_only@localhost:5432/rems_ci_upgrade
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -c 'CREATE DATABASE rems_ci_upgrade'
          psql -v ON_ERROR_STOP=1 "$UPGRADE_ADMIN_URL" -f packages/database/prisma/migrations/20260729000000_red_001_foundation/migration.sql
          DATABASE_URL="$UPGRADE_ADMIN_URL" pnpm --filter @rems/database exec prisma migrate resolve --schema prisma/schema.prisma --applied 20260729000000_red_001_foundation
          psql -v ON_ERROR_STOP=1 "$UPGRADE_ADMIN_URL" -f packages/database/security/bootstrap-roles.sql
          psql -v ON_ERROR_STOP=1 "$UPGRADE_ADMIN_URL" -f packages/database/security/bootstrap-identity-admin-role.sql
          DATABASE_URL="$UPGRADE_MIGRATION_URL" pnpm --filter @rems/database prisma:migrate:deploy
          psql -v ON_ERROR_STOP=1 "$UPGRADE_ADMIN_URL" -f packages/database/security/bootstrap-security-reader-role.sql
          psql -v ON_ERROR_STOP=1 "$UPGRADE_ADMIN_URL" -f packages/database/security/bootstrap-backup-role.sql
          DATABASE_URL="postgresql://rems_application:rems_application_ci_only@localhost:5432/rems_ci_upgrade" \
          APPLICATION_DATABASE_URL="postgresql://rems_application:rems_application_ci_only@localhost:5432/rems_ci_upgrade" \
          AUDIT_READER_DATABASE_URL="postgresql://rems_audit_reader:rems_audit_reader_ci_only@localhost:5432/rems_ci_upgrade" \
          MIGRATION_DATABASE_URL="$UPGRADE_MIGRATION_URL" \
          IDENTITY_ADMIN_DATABASE_URL="postgresql://rems_identity_admin:rems_identity_admin_ci_only@localhost:5432/rems_ci_upgrade" \
          FOUNDER_BOOTSTRAP_DATABASE_URL="postgresql://rems_founder_bootstrap:rems_founder_bootstrap_ci_only@localhost:5432/rems_ci_upgrade" \
          SECURITY_READER_DATABASE_URL="postgresql://rems_security_reader:rems_security_reader_ci_only@localhost:5432/rems_ci_upgrade" \
          pnpm test:db-security
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -At -f packages/database/security/inspect-security-state.sql > /tmp/fresh-security-state
          psql -v ON_ERROR_STOP=1 "$UPGRADE_ADMIN_URL" -At -f packages/database/security/inspect-security-state.sql > /tmp/upgrade-security-state
          diff -u /tmp/fresh-security-state /tmp/upgrade-security-state
      - name: Verify vendor-neutral backup and restoration
        env:
          BACKUP_FILE: /tmp/rems-ci.dump
          RESTORE_ADMIN_URL: postgresql://rems_ci:ci_only@localhost:5432/rems_ci_restore
          RESTORE_DATABASE_URL: postgresql://rems_migration_owner:rems_migration_owner_ci_only@localhost:5432/rems_ci_restore
          RESTORE_APPLICATION_URL: postgresql://rems_application:rems_application_ci_only@localhost:5432/rems_ci_restore
          RESTORE_AUDIT_READER_URL: postgresql://rems_audit_reader:rems_audit_reader_ci_only@localhost:5432/rems_ci_restore
          RESTORE_SECURITY_READER_URL: postgresql://rems_security_reader:rems_security_reader_ci_only@localhost:5432/rems_ci_restore
          RESTORE_BACKUP_URL: postgresql://rems_backup:rems_backup_ci_only@localhost:5432/rems_ci_restore
        run: |
          test "$(command -v pg_dump)" = /usr/lib/postgresql/17/bin/pg_dump
          test "$(command -v pg_restore)" = /usr/lib/postgresql/17/bin/pg_restore
          pg_dump --version
          pg_restore --version
          psql -v ON_ERROR_STOP=1 "$MIGRATION_DATABASE_URL" <<'SQL'
          INSERT INTO "ExecutiveIdentity" (id,"displayName","updatedAt")
          VALUES ('restore-founder','Restore Founder','2026-07-30T00:00:00Z');
          INSERT INTO "OrganizationUnit" (id,name,kind)
          VALUES ('restore-org','Restore Org','ORGANIZATION');
          INSERT INTO "Membership" (id,"executiveId","unitId",role)
          VALUES ('restore-membership','restore-founder','restore-org','FOUNDER');
          INSERT INTO "ExternalIdentityLink" (id,issuer,subject,"executiveId","updatedAt")
          VALUES ('11111111-1111-4111-8111-111111111111','https://restore.test','restore-subject','restore-founder','2026-07-30T00:00:01Z');
          INSERT INTO "AuditEvent" (id,"occurredAt","actorId",type,"subjectId",payload)
          VALUES ('33333333-3333-4333-8333-333333333333','2026-07-30T00:00:02Z','restore-founder','restore.verification','restore-founder','{}'::jsonb);
          INSERT INTO "SystemSecurityEvidence" (id,"occurredAt","eventType",outcome,"reasonCode","correlationId")
          VALUES ('22222222-2222-4222-8222-222222222222','2026-07-30T00:00:03Z','AUTHENTICATION_REJECTED','DENIED','MALFORMED_TOKEN','restore-verification');
          SQL
          ./scripts/operations/backup.sh
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -c 'CREATE DATABASE rems_ci_restore OWNER rems_migration_owner'
          ./scripts/operations/restore.sh
          psql -v ON_ERROR_STOP=1 "$RESTORE_ADMIN_URL" -f packages/database/security/bootstrap-roles.sql
          psql -v ON_ERROR_STOP=1 "$RESTORE_ADMIN_URL" -f packages/database/security/bootstrap-identity-admin-role.sql
          psql -v ON_ERROR_STOP=1 "$RESTORE_ADMIN_URL" -f packages/database/security/bootstrap-security-reader-role.sql
          psql -v ON_ERROR_STOP=1 "$RESTORE_ADMIN_URL" -f packages/database/security/bootstrap-backup-role.sql
          psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -f packages/database/security/reapply-restored-grants.sql
          assert_equals() {
            assertion_name="$1"
            expected="$2"
            actual="$3"
            if [ "$actual" != "$expected" ]; then
              printf 'assertion failed: %s expected=%s actual=%s\n' "$assertion_name" "$expected" "$actual" >&2
              return 1
            fi
            printf 'assertion passed: %s\n' "$assertion_name"
          }
          assert_archive_contains() {
            assertion_name="$1"
            fixture_id="$2"
            if ! grep -Fq "$fixture_id" /tmp/rems-ci-data.sql; then
              printf 'assertion failed: %s expected=present actual=absent\n' "$assertion_name" >&2
              return 1
            fi
            printf 'assertion passed: %s\n' "$assertion_name"
          }
          assert_files_equal() {
            assertion_name="$1"
            expected_file="$2"
            actual_file="$3"
            if ! cmp --silent "$expected_file" "$actual_file"; then
              printf 'assertion failed: %s expected=matching actual=different\n' "$assertion_name" >&2
              return 1
            fi
            printf 'assertion passed: %s\n' "$assertion_name"
          }
          assert_sql_denied() {
            assertion_name="$1"
            connection_url="$2"
            statement="$3"
            if psql -v ON_ERROR_STOP=1 "$connection_url" -c "$statement" > /dev/null 2>&1; then
              printf 'assertion failed: %s expected=denied actual=allowed\n' "$assertion_name" >&2
              return 1
            fi
            printf 'assertion passed: %s\n' "$assertion_name"
          }
          pg_restore --data-only --file=/tmp/rems-ci-data.sql "$BACKUP_FILE"
          assert_archive_contains archive_executive_identity restore-founder
          assert_archive_contains archive_organization_unit restore-org
          assert_archive_contains archive_membership restore-membership
          assert_archive_contains archive_external_identity_link 11111111-1111-4111-8111-111111111111
          assert_archive_contains archive_audit_event 33333333-3333-4333-8333-333333333333
          assert_archive_contains archive_system_security_evidence 22222222-2222-4222-8222-222222222222
          rm -f /tmp/rems-ci-data.sql
          assert_equals restored_executive_identity 1 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc 'SELECT count(*) FROM "ExecutiveIdentity" WHERE id='"'"'restore-founder'"'"'')"
          assert_equals restored_organization_unit 1 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc 'SELECT count(*) FROM "OrganizationUnit" WHERE id='"'"'restore-org'"'"'')"
          assert_equals restored_membership 1 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc 'SELECT count(*) FROM "Membership" WHERE id='"'"'restore-membership'"'"' AND "executiveId"='"'"'restore-founder'"'"' AND "unitId"='"'"'restore-org'"'"' AND role='"'"'FOUNDER'"'"'')"
          assert_equals restored_external_identity_link 1 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc 'SELECT count(*) FROM "ExternalIdentityLink" WHERE subject='"'"'restore-subject'"'"'')"
          assert_equals restored_audit_event 1 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc 'SELECT count(*) FROM "AuditEvent" WHERE id='"'"'33333333-3333-4333-8333-333333333333'"'"'')"
          assert_equals restored_system_security_evidence 1 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc 'SELECT count(*) FROM "SystemSecurityEvidence" WHERE "correlationId"='"'"'restore-verification'"'"'')"
          assert_equals restored_migration_ownership 6 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tableowner='rems_migration_owner' AND tablename IN ('ExecutiveIdentity','OrganizationUnit','Membership','ExternalIdentityLink','AuditEvent','SystemSecurityEvidence')")"
          assert_equals application_executive_select t "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc "SELECT has_table_privilege('rems_application','public.\"ExecutiveIdentity\"','SELECT')")"
          assert_equals application_audit_insert t "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc "SELECT has_table_privilege('rems_application','public.\"AuditEvent\"','INSERT')")"
          assert_equals application_audit_update_denied f "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc "SELECT has_table_privilege('rems_application','public.\"AuditEvent\"','UPDATE')")"
          assert_equals audit_reader_audit_select t "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc "SELECT has_table_privilege('rems_audit_reader','public.\"AuditEvent\"','SELECT')")"
          assert_equals security_reader_evidence_select t "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc "SELECT has_table_privilege('rems_security_reader','public.\"SystemSecurityEvidence\"','SELECT')")"
          assert_equals backup_link_select t "$(psql -v ON_ERROR_STOP=1 "$RESTORE_DATABASE_URL" -Atc "SELECT has_table_privilege('rems_backup','public.\"ExternalIdentityLink\"','SELECT')")"
          psql -v ON_ERROR_STOP=1 "$RESTORE_ADMIN_URL" -At -f packages/database/security/inspect-security-state.sql > /tmp/restored-security-state
          assert_files_equal restored_security_state /tmp/fresh-security-state /tmp/restored-security-state
          rm -f /tmp/restored-security-state
          assert_equals application_record_read 1 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_APPLICATION_URL" -Atc 'SELECT count(*) FROM "ExecutiveIdentity" WHERE id='"'"'restore-founder'"'"'')"
          assert_equals audit_reader_record_read 1 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_AUDIT_READER_URL" -Atc 'SELECT count(*) FROM "AuditEvent" WHERE id='"'"'33333333-3333-4333-8333-333333333333'"'"'')"
          assert_equals security_reader_record_read 1 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_SECURITY_READER_URL" -Atc 'SELECT count(*) FROM "SystemSecurityEvidence" WHERE id='"'"'22222222-2222-4222-8222-222222222222'"'"'')"
          assert_equals backup_record_read 1 "$(psql -v ON_ERROR_STOP=1 "$RESTORE_BACKUP_URL" -Atc 'SELECT count(*) FROM "ExternalIdentityLink" WHERE id='"'"'11111111-1111-4111-8111-111111111111'"'"'')"
          assert_sql_denied application_audit_update "$RESTORE_APPLICATION_URL" 'UPDATE "AuditEvent" SET type='"'"'forbidden'"'"' WHERE id='"'"'33333333-3333-4333-8333-333333333333'"'"''
          assert_sql_denied application_audit_truncate "$RESTORE_APPLICATION_URL" 'TRUNCATE TABLE "AuditEvent"'
          assert_sql_denied application_security_evidence_update "$RESTORE_APPLICATION_URL" 'UPDATE "SystemSecurityEvidence" SET "reasonCode"='"'"'INVALID_SIGNATURE'"'"' WHERE id='"'"'22222222-2222-4222-8222-222222222222'"'"''
          assert_sql_denied audit_reader_audit_delete "$RESTORE_AUDIT_READER_URL" 'DELETE FROM "AuditEvent" WHERE id='"'"'33333333-3333-4333-8333-333333333333'"'"''
          assert_sql_denied security_reader_evidence_delete "$RESTORE_SECURITY_READER_URL" 'DELETE FROM "SystemSecurityEvidence" WHERE id='"'"'22222222-2222-4222-8222-222222222222'"'"''
          assert_sql_denied backup_identity_update "$RESTORE_BACKUP_URL" 'UPDATE "ExecutiveIdentity" SET "displayName"='"'"'forbidden'"'"' WHERE id='"'"'restore-founder'"'"''
          assert_sql_denied backup_schema_create "$RESTORE_BACKUP_URL" 'CREATE TABLE forbidden_restore_backup(id int)'
          rm -f "$BACKUP_FILE"
      - name: Lock down one-time Founder bootstrap login
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -f packages/database/security/lockdown-founder-bootstrap-role.sql
          test "$(psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" -Atc "SELECT rolcanlogin FROM pg_roles WHERE rolname = 'rems_founder_bootstrap'")" = "f"
      - run: pnpm build
      - name: Build and verify non-root production containers
        run: |
          docker build --target api -t rems-api:${{ github.sha }} .
          docker build --target web -t rems-web:${{ github.sha }} .
          test "$(docker image inspect rems-api:${{ github.sha }} --format '{{.Config.User}}')" = node
          test "$(docker image inspect rems-web:${{ github.sha }} --format '{{.Config.User}}')" = node
          test -z "$(docker run --rm rems-api:${{ github.sha }} sh -c 'find /app -name .env -o -name .git -o -name "*.test.ts" | head -1')"
          docker run --rm --entrypoint sh rems-api:${{ github.sha }} -c '
            for pattern in "vitest@*" "vite@*" "typescript@*" "@esbuild+*" "esbuild@*" "sharp@*" "postcss@*" "sigstore@*" "tar@*" "browserslist@*" "acorn@*" "webpack@*" "prettier@*" "prisma@*"; do
              if find /app/node_modules/.pnpm -mindepth 1 -maxdepth 1 -type d -name "$pattern" | grep -q .; then
                echo "prohibited development package present: $pattern" >&2
                exit 1
              fi
            done
            test -z "$(find /app -type f \( -name "*.ts" -o -name "*.map" \) -print -quit)"
            prisma_client="$(find /app/node_modules/.pnpm -path "*/node_modules/.prisma/client" -type d -print -quit)"
            test -n "$prisma_client"
            test ! -e "$prisma_client/client"
            test -s "$prisma_client/schema.prisma"
            test -s "$prisma_client/default.js"
            test -s "$prisma_client/index.js"
            test -n "$(find "$prisma_client" -maxdepth 1 -type f -name "libquery_engine-*.so.node" -print -quit)"
            node -e "Promise.all([import('"'"'@rems/config'"'"'),import('"'"'@rems/database'"'"'),import('"'"'@rems/observability'"'"'),import('"'"'@rems/red-001'"'"')]).then(([,database])=>new database.PrismaService())"
          '
          api_container="$(docker run --detach --network host \
            --env NODE_ENV=production --env HOST=0.0.0.0 --env PORT=3001 \
            --env TRUSTED_PROXY=false --env DATABASE_URL="$APPLICATION_DATABASE_URL" \
            --env OIDC_ISSUER=https://identity.invalid --env OIDC_AUDIENCE=rems-api \
            --env OIDC_ALLOWED_ALGORITHMS=RS256 rems-api:${{ github.sha }})"
          trap 'docker rm --force "$api_container" > /dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$api_container" wget -q -O /dev/null http://127.0.0.1:3001/health/live \
              && docker exec "$api_container" wget -q -O /dev/null http://127.0.0.1:3001/health/ready; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo 'pruned API container did not become ready' >&2
              exit 1
            fi
            sleep 1
          done
          docker rm --force "$api_container" > /dev/null
          trap - EXIT
      - name: Generate standard SBOM evidence
        # anchore/sbom-action v0.17.2
        uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a
        with:
          image: rems-api:${{ github.sha }}
          format: cyclonedx-json
          output-file: rems-api-sbom.cdx.json
      - name: Scan API production image (findings are not suppressed)
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: rems-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
      - run: pnpm test:e2e
      - run: git diff --check
