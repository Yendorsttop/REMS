# NON-PRODUCTION convenience stack. Never reuse these credentials or topology.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rems
      POSTGRES_USER: rems_local
      POSTGRES_PASSWORD: local_only
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U rems_local -d rems'],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
    volumes: ['rems-postgres:/var/lib/postgresql/data']
  api:
    build: { context: ., target: api }
    environment:
      {
        NODE_ENV: 'development',
        DATABASE_URL: 'postgresql://rems_local:local_only@postgres:5432/rems',
        HOST: '0.0.0.0',
        PORT: '3001',
      }
    ports: ['3001:3001']
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build: { context: ., target: web }
    ports: ['3000:3000']
volumes: { rems-postgres: {} }
